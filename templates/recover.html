<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recover Account | FinanceFlow</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0F172A',
                        darkcard: '#1E293B'
                    }
                }
            }
        }
    </script>
    
    <!-- Instant Dark Mode Script -->
    <script>
        if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark");
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col justify-center items-center px-4 pt-20 pb-8 transition-colors duration-200 antialiased">

    <!-- Fixed Top Navigation Header -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 z-50 flex items-center justify-between px-4 sm:px-8">
        <a href="{{ url_for('login_page') }}" class="flex items-center space-x-2.5 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-teal-500/20 group-hover:scale-105 transition-transform">
                <i class="fa-solid fa-wallet text-sm"></i>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="text-base font-black tracking-tight bg-gradient-to-r from-teal-700 to-teal-500 dark:from-teal-400 dark:to-emerald-300 bg-clip-text text-transparent">FinanceFlow</span>
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20">v{{ app_version }}</span>
            </div>
        </a>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
            </button>
            <a href="{{ url_for('login_page') }}" class="text-xs font-bold text-teal-600 dark:text-teal-400 hover:bg-teal-50 dark:hover:bg-teal-950/50 px-3 py-1.5 rounded-xl border border-teal-500/30 transition-colors">
                Sign In
            </a>
        </div>
    </header>

    <div class="w-full max-w-lg">
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20 flex items-center justify-center shadow-md mb-3">
                <i class="fa-solid fa-key text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Recover Your Account</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Reset your password using your 12-keyword backup recovery phrase</p>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none">
            
            {% if error %}
            <div class="mb-5 p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-semibold flex items-center space-x-2.5">
                <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('recover_page') }}" class="space-y-4">
                <!-- Username -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Your Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" name="username" required placeholder="Enter your username" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                    </div>
                </div>

                <!-- Recovery Phrase -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">12 Backup Keywords</label>
                        <span class="text-[11px] text-slate-400">Separated by spaces</span>
                    </div>
                    <div class="relative">
                        <textarea name="recovery_phrase" required rows="3" placeholder="abandon ability able about above absent absorb abstract absurd abuse access accident" class="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 outline-none transition-all leading-relaxed"></textarea>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">New Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" name="new_password" required placeholder="Choose a new strong password (min 6 chars)" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Confirm New Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-shield absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" name="confirm_new_password" required placeholder="Re-type your new password" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold rounded-xl shadow-md shadow-teal-600/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-key"></i>
                        <span>Reset Password & Regain Access</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                <a href="{{ url_for('login_page') }}" class="font-semibold text-slate-500 hover:text-teal-600 transition-colors">&larr; Back to Login</a>
                <a href="{{ url_for('register_page') }}" class="font-bold text-teal-600 dark:text-teal-400 hover:underline">Create New Account</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }
    </script>
</body>
</html>
