<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Two-Factor Verification | FinanceFlow</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0F172A',
                        darkcard: '#1E293B'
                    }
                }
            }
        }
    </script>
    
    <!-- Instant Dark Mode Script -->
    <script>
        if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        } else {
            document.documentElement.classList.remove("dark");
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.svg') }}">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col justify-center items-center px-4 pt-20 pb-8 transition-colors duration-200 antialiased">

    <!-- Fixed Top Navigation Header -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 z-50 flex items-center justify-between px-4 sm:px-8">
        <a href="{{ url_for('login_page') }}" class="flex items-center space-x-2.5 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-teal-500/20 group-hover:scale-105 transition-transform">
                <i class="fa-solid fa-wallet text-sm"></i>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="text-base font-black tracking-tight bg-gradient-to-r from-teal-700 to-teal-500 dark:from-teal-400 dark:to-emerald-300 bg-clip-text text-transparent">FinanceFlow</span>
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-teal-500/10 text-teal-600 dark:text-teal-400 border border-teal-500/20">v{{ app_version }}</span>
            </div>
        </a>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
            </button>
            <a href="{{ url_for('login_page') }}" class="text-xs font-bold text-teal-600 dark:text-teal-400 hover:bg-teal-50 dark:hover:bg-teal-950/50 px-3 py-1.5 rounded-xl border border-teal-500/30 transition-colors">
                Back to Sign In
            </a>
        </div>
    </header>

    <!-- Verification Card -->
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none space-y-6">
            <!-- Icon & Heading -->
            <div class="text-center space-y-2">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white shadow-lg shadow-teal-500/25">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">Two-Factor Verification</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">
                    Hi <span class="font-bold text-slate-700 dark:text-slate-300">{{ username }}</span>, enter the 6-digit code from your authenticator app to complete your sign in.
                </p>
            </div>

            {% if error %}
            <div class="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/50 text-rose-700 dark:text-rose-300 text-xs flex items-center space-x-2.5">
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('verify_2fa_page', next=request.args.get('next')) }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 text-center">
                        6-Digit Security Code
                    </label>
                    <input type="text" name="totp_code" maxlength="6" autofocus placeholder="• • • • • •" inputmode="numeric" class="w-full text-center tracking-widest text-3xl font-black py-3 px-4 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-900 dark:text-white focus:ring-2 focus:ring-teal-500 outline-none transition-all placeholder:text-slate-300 dark:placeholder:text-slate-600 font-mono">
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-teal-600/20 active:scale-95 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-lock-open text-xs"></i>
                    <span>Verify & Continue</span>
                </button>
            </form>

            <!-- Recovery Phrase Alternative -->
            <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-center">
                <details class="text-xs text-slate-500 dark:text-slate-400 group">
                    <summary class="cursor-pointer hover:text-teal-600 dark:hover:text-teal-400 font-semibold select-none list-none flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-key text-[10px]"></i>
                        <span>Lost access to authenticator?</span>
                        <i class="fa-solid fa-chevron-down text-[10px] group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <form method="POST" action="{{ url_for('verify_2fa_page', next=request.args.get('next')) }}" class="mt-3 space-y-2 text-left">
                        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400">Use your 12-word backup recovery phrase:</label>
                        <textarea name="recovery_phrase" rows="2" placeholder="word1 word2 word3 ..." class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                        <button type="submit" class="w-full py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-800 dark:text-slate-200 text-xs font-bold rounded-lg transition-colors">
                            Verify with Recovery Phrase
                        </button>
                    </form>
                </details>
            </div>

            <div class="text-center pt-2">
                <a href="{{ url_for('login_page') }}" class="text-xs font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                    &larr; Cancel and return to sign in
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }
    </script>
</body>
</html>
